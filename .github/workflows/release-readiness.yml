name: Release readiness preflight
on:
  push:
    branches: ["feat/paid-asset-engine-integration"]
    paths: ["src/**","public/sw.js","scripts/release-readiness.mjs","scripts/build-offline-manifest.mjs","tests/release-*.test.mjs",".github/workflows/release-readiness.yml"]
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium --with-deps
      - run: node scripts/release-readiness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-readiness
          path: |
            reports/release-readiness.json
            reports/release-screens/
          if-no-files-found: warn

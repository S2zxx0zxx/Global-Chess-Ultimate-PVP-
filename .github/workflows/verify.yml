name: Verify playable chess
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: P01 browser baseline
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium --with-deps
          node scripts/p01-browser-baseline.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: p01-browser-baseline
          path: reports/p01-browser-baseline.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: global-chess-ultimate-preview
          path: dist/
          if-no-files-found: error

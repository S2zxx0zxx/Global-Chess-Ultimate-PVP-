name: Verify playable chess
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: P01 browser baseline
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium --with-deps
          node scripts/p01-browser-baseline.mjs
      - name: P02 worker browser baseline
        run: node scripts/p02-worker-baseline.mjs
      - name: P03 paired advanced search
        run: node scripts/p03-advanced-benchmark.mjs
      - name: P04 fixed-depth and bitboard profile
        run: node --experimental-strip-types scripts/p04-search-profile.mjs
      - name: P04 browser comparison
        run: node scripts/p04-browser.mjs
      - name: P05 difficulty and paired self-play
        run: node --experimental-strip-types scripts/p05-difficulty.mjs
      - name: P05 production offline lifecycle
        run: node scripts/p05-offline.mjs
      - name: P05 fault-injected lifecycle acceptance
        run: node scripts/p05-lifecycle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: p05-computer-mode
          path: |
            reports/p05-difficulty.json
            reports/p05-offline.json
            reports/p05-lifecycle.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: p04-profile
          path: |
            reports/p04-search-profile.json
            reports/p04-browser.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: p03-advanced-search
          path: reports/p03-advanced-search.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: p02-worker-baseline
          path: reports/p02-worker-baseline.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: p01-browser-baseline
          path: reports/p01-browser-baseline.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: global-chess-ultimate-preview
          path: dist/
          if-no-files-found: error

name: Acquire exact approved premium chess resources
on:
  push:
    branches: ["feat/chess-five-resource-upgrades"]
permissions:
  contents: write
concurrency:
  group: five-premium-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    if: github.repository == 'S2zxx0zxx/Global-Chess-Ultimate-PVP-' && github.ref == 'refs/heads/feat/chess-five-resource-upgrades'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check whether exact assets are already installed
        id: present
        shell: bash
        run: |
          if node scripts/verify-five-assets.mjs; then echo "installed=true" >> "$GITHUB_OUTPUT"; else echo "installed=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.present.outputs.installed == 'false'
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Retrieve exact free source and verify all hashes
        if: steps.present.outputs.installed == 'false'
        run: |
          node scripts/acquire-five-premium.mjs
          npm run assets:verify:five
      - name: Verify all four actual FBX themes before publishing
        if: steps.present.outputs.installed == 'false'
        run: |
          npm run verify
          node scripts/five-resource-browser.mjs --premium
      - name: Commit only the verified original chess assets
        if: steps.present.outputs.installed == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/assets/five-resource/premium-low.fbx public/assets/five-resource/premium-low-fantasy.fbx public/assets/five-resource/premium-high.fbx public/assets/five-resource/premium-high-fantasy.fbx public/assets/five-resource/manifest.json public/assets/five-resource/NOTICE.txt
          git diff --cached --quiet && exit 0
          git commit -m "Import four exact SHA-256-verified Georgez05 FBX chess sets"
          git push origin HEAD:refs/heads/feat/chess-five-resource-upgrades
